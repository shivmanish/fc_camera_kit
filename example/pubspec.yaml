name: fc_camera_kit_example
description: "Demo app for the fc_camera_kit package."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  fc_camera_kit:
    path: ../

  # Used directly by the example screen.
  flutter_bloc: ^9.1.1
  intl: ^0.20.3
  equatable: ^3.0.0

  cupertino_icons: ^1.0.8
  share_plus: ^12.0.2
  native_exif: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true
