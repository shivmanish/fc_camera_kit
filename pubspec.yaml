name: fc_camera_kit
description: >-
  Capture, stamp, compress and scan photos with embedded who/when/where
  metadata. Feature-first clean architecture, Cubit driven, Android and iOS.
version: 1.0.0

# Android and iOS only: uses dart:io and native codecs.
platforms:
  android:
  ios:

topics:
  - camera
  - watermark
  - exif
  - image-compression

environment:
  sdk: ^3.9.2
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # Capture
  image_picker: ^1.2.2
  # Merges RECORD_AUDIO into the host manifest; hosts remove it (see README).
  camera: ">=0.11.3 <0.13.0"
  # 0.15 needs Flutter 3.44, above the 3.35 floor.
  google_mlkit_face_detection: ">=0.13.1 <0.15.0"
  cunning_document_scanner: ^3.0.3

  # Image pipeline
  flutter_image_compress: ^2.5.1
  native_exif: ^0.7.0

  # Permissions and location
  # 13.x needs AGP 9; 12.x builds on AGP 8.
  permission_handler: ^12.0.1
  geolocator: ">=13.0.2 <15.0.0"
  # 5.x removed the top-level functions hosts still call.
  geocoding: ">=3.0.0 <5.0.0"

  # Utilities
  device_info_plus: ^12.4.0
  path_provider: ^2.1.5
  path: ^1.9.1
  cross_file: ^0.3.5+2
  # Flutter 3.35 flutter_localizations pins 0.20.2.
  intl: ^0.20.2
  meta: ^1.16.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  mocktail: ^1.0.5

flutter:
